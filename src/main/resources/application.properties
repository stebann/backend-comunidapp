# Nombre de la aplicación
spring.application.name=comunidapp-backend

# --- CONFIGURACIÓN DEL SERVIDOR ---
server.port=${PORT:8080}

# --- CONFIGURACIÓN LOCAL ---
spring.datasource.url=jdbc:mysql://localhost:3306/comunidapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configuración de subida de archivos (multipart)
# Tamaño máximo por archivo individual
spring.servlet.multipart.max-file-size=10MB
# Tamaño máximo de toda la petición (todos los archivos juntos)
spring.servlet.multipart.max-request-size=30MB

# Configuración de la zona horaria
spring.jackson.time-zone=America/Bogota

# Swagger
springdoc.swagger-ui.path=/
springdoc.swagger-ui.url=/v3/api-docs

# --- CONFIGURACIÓN DE CLOUDINARY ---
# Configuración para almacenamiento de imágenes en Cloudinary
# Obtén estos valores desde tu panel de Cloudinary: https://console.cloudinary.com/
#
# OPCIÓN 1: Usar CLOUDINARY_URL (recomendado por Cloudinary)
# Formato: cloudinary://API_KEY:API_SECRET@CLOUD_NAME
# Si defines la variable de entorno CLOUDINARY_URL, Cloudinary la usará automáticamente
#
# OPCIÓN 2: Usar propiedades individuales (alternativa)
